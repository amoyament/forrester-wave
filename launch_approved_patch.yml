---
- name: Trigger Approved Patch Deployment
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Launch workflow with approval gate
      ansible.controller.workflow_launch:
        workflow_template: "RHEL - Approved Patch Deployment"
        wait: false
      register: workflow_result

    - name: Report workflow job ID
      ansible.builtin.debug:
        msg: "Workflow job {{ workflow_result.id }} launched. Pending manager approval."

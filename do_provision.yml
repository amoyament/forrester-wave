# provision_cloud_environment.yml, before the approval request is sent.
- name: Execute Cloud Provisioning
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Provisioning approved, deploying resources
      ansible.builtin.debug:
        msg: "Provisioning approved. Deploying resources now."

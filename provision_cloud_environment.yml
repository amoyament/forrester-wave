---
- name: Provision Cloud Environment
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    aws_region: "{{ region }}"
    instance_types:
      "t3.small": "t3.small"
      "t3.medium": "t3.medium"
      "t3.large": "t3.large"
    db_ports:
      postgresql: 5432
      mysql: 3306
    db_engine_map:
      postgresql: postgres
      mysql: mysql
    ami_ids:
      us-east-1: ami-0a62b599d0176c4e7
      us-west-2: ami-04761b0808e04b499
      eu-west-1: ami-06f878aa175fccba7
    safe_name: "{{ environment_name | regex_replace('[^A-Za-z0-9._-]', '-') }}"
    db_password: "Forrest2026Demo"
    # Toggle: add extra var policy_scenario: fail_volume on the JT, launch, then remove it.
    policy_scenario: pass
    policy_approved_sizes:
      - t3.small
      - t3.medium
      - t3.large
    policy_approved_regions:
      - us-east-1
      - us-west-2
      - eu-west-1
    policy_financial_budget_usd: 500
    policy_instance_monthly_cost:
      t3.small: 15
      t3.medium: 30
      t3.large: 60
    policy_max_ttl_hours: 72
    policy_max_active_environments: 3
    policy_dummy_inventory_pass:
      - "forrester-demo (t3.medium, us-east-1)"
    policy_dummy_inventory_fail:
      - "demo-api-1 (t3.medium, us-east-1)"
      - "demo-web-2 (t3.small, us-west-2)"
      - "demo-batch-3 (t3.large, us-east-1)"

  tasks:
    - name: Display provisioning request
      ansible.builtin.debug:
        msg:
          - "Environment: {{ environment_name }}"
          - "Instance Size: {{ instance_size }}"
          - "Region: {{ region }}"
          - "TTL: {{ ttl_hours }} hours"
          - "Database Engine: {{ database_engine }}"
          - "Monitoring: {{ enable_monitoring }}"

    - name: "Policy: Validate Scope & Infra"
      vars:
        _size: "{{ instance_size | default('t3.medium') }}"
        _region: "{{ region | default('us-east-1') }}"
        _ok: "{{ _size in policy_approved_sizes and _region in policy_approved_regions }}"
      ansible.builtin.debug:
        msg: |
          Requested: {{ _size }} in {{ _region }}
          Approved sizes: {{ policy_approved_sizes | join(', ') }}
          Approved regions: {{ policy_approved_regions | join(', ') }}
          {% if _ok | bool %}PASS: Confirms {{ _size }} and {{ _region }} are approved for Dev scope{% else %}FAIL: {{ _size }} in {{ _region }} is not approved for Dev scope{% endif %}
      failed_when: not (_ok | bool)

    - name: "Policy: Verify Financial Budget"
      vars:
        _cost: "{{ policy_instance_monthly_cost[instance_size | default('t3.medium')] | default(30) | int }}"
        _ok: "{{ (_cost | int) < (policy_financial_budget_usd | int) }}"
      ansible.builtin.debug:
        msg: |
          Instance: {{ instance_size | default('t3.medium') }}
          Estimated monthly cost: ${{ _cost }}
          Self-service budget: ${{ policy_financial_budget_usd }}/mo
          {% if _ok | bool %}PASS: Calculates run cost is under the ${{ policy_financial_budget_usd }}/mo self-service limit{% else %}FAIL: Estimated ${{ _cost }}/mo exceeds the ${{ policy_financial_budget_usd }}/mo self-service limit{% endif %}
      failed_when: not (_ok | bool)

    - name: "Policy: Enforce Duration limits"
      vars:
        _ttl: "{{ ttl_hours | default(8) | int }}"
        _ok: "{{ (_ttl | int) <= (policy_max_ttl_hours | int) }}"
      ansible.builtin.debug:
        msg: |
          Requested TTL: {{ _ttl }} hours
          Maximum TTL: {{ policy_max_ttl_hours }} hours
          {% if _ok | bool %}PASS: Confirms TTL is <= {{ policy_max_ttl_hours }} hours{% else %}FAIL: TTL {{ _ttl }} exceeds the {{ policy_max_ttl_hours }} hour duration cap{% endif %}
      failed_when: not (_ok | bool)

    - name: "Policy: Check Volume Quotas"
      vars:
        _inventory: "{{ policy_dummy_inventory_fail if (policy_scenario | default('pass')) == 'fail_volume' else policy_dummy_inventory_pass }}"
        _count: "{{ _inventory | length }}"
        _ok: "{{ (_count | int) < (policy_max_active_environments | int) }}"
      ansible.builtin.debug:
        msg: |
          Requester: {{ tower_user_name | default(awx_user_name | default('aubrey')) }}
          Active environments ({{ _count }}):
          {%- for env in _inventory %}
            {{ env }}
          {%- endfor %}
          Limit: {{ policy_max_active_environments }}
          {% if _ok | bool %}PASS: Confirms user has < {{ policy_max_active_environments }} active environments{% else %}FAIL: Developer already has {{ _count }} active environments. FinOps policy blocked the build to prevent cloud sprawl.{% endif %}
      failed_when: not (_ok | bool)

    - name: Sending request for approval
      ansible.builtin.uri:
        url: "{{ lookup('env', 'CONTROLLER_HOST') }}/api/controller/v2/workflow_job_templates/45/launch/"
        method: POST
        user: "{{ lookup('env', 'CONTROLLER_USERNAME') }}"
        password: "{{ lookup('env', 'CONTROLLER_PASSWORD') }}"
        force_basic_auth: true
        validate_certs: false
        body_format: json
        body:
          extra_vars:
            requested_environment: "{{ environment_name }}"
            requested_instance_size: "{{ instance_size }}"
            requested_region: "{{ region }}"
            requested_ttl: "{{ ttl_hours }}"
            requested_database: "{{ database_engine }}"
            requested_monitoring: "{{ enable_monitoring }}"
        status_code: 201
      register: launch_result
      no_log: true

    - name: Approval pending
      ansible.builtin.uri:
        url: "{{ lookup('env', 'CONTROLLER_HOST') }}/api/controller/v2/workflow_jobs/{{ launch_result.json.id }}/"
        method: GET
        user: "{{ lookup('env', 'CONTROLLER_USERNAME') }}"
        password: "{{ lookup('env', 'CONTROLLER_PASSWORD') }}"
        force_basic_auth: true
        validate_certs: false
      register: wf_status
      until: wf_status.json.status in ['successful', 'failed', 'error', 'canceled']
      retries: 360
      delay: 10
      no_log: true

    - name: Approval denied
      ansible.builtin.fail:
        msg: "Request was denied or timed out"
      when: wf_status.json.status != 'successful'

    - name: Approval granted
      ansible.builtin.debug:
        msg: "Approved. Provisioning {{ environment_name }} in {{ region }}."

    - name: Create security group
      amazon.aws.ec2_security_group:
        name: "{{ safe_name }}-sg"
        description: "Security group for {{ environment_name }}"
        region: "{{ aws_region }}"
        rules:
          - proto: tcp
            from_port: 22
            to_port: 22
            cidr_ip: 0.0.0.0/0
          - proto: tcp
            from_port: 80
            to_port: 80
            cidr_ip: 0.0.0.0/0
          - proto: tcp
            from_port: 443
            to_port: 443
            cidr_ip: 0.0.0.0/0
          - proto: tcp
            from_port: 8080
            to_port: 8080
            cidr_ip: 0.0.0.0/0
        tags:
          Name: "{{ safe_name }}-sg"
          Environment: "{{ environment_name }}"
          ManagedBy: ansible-portal
          owner: forrest
      register: sg_result

    - name: Launch EC2 instance ({{ instance_size }})
      amazon.aws.ec2_instance:
        name: "{{ environment_name }}"
        instance_type: "{{ instance_types[instance_size] }}"
        image_id: "{{ ami_ids[aws_region] }}"
        region: "{{ aws_region }}"
        key_name: dev-team
        security_groups:
          - "{{ sg_result.group_id }}"
        wait: true
        user_data: |
          #!/bin/bash
          yum install -y httpd postgresql mysql
          cat > /var/www/html/index.html <<'LANDING'
          <!DOCTYPE html>
          <html>
          <head>
            <title>{{ environment_name }}</title>
            <style>
              body { font-family: sans-serif; background: #1a1a2e; color: #e0e0e0; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
              .card { background: #16213e; border-radius: 12px; padding: 40px; max-width: 600px; box-shadow: 0 4px 24px rgba(0,0,0,0.4); }
              h1 { color: #e94560; margin-top: 0; }
              .detail { margin: 12px 0; padding: 8px 12px; background: #0f3460; border-radius: 6px; }
              .label { color: #a0a0a0; font-size: 0.85em; }
              .value { color: #fff; font-weight: bold; }
              .status { color: #4ecca3; font-weight: bold; font-size: 1.1em; }
            </style>
          </head>
          <body>
            <div class="card">
              <h1>{{ environment_name }}</h1>
              <p class="status">Environment Active</p>
              <div class="detail"><span class="label">Instance Size:</span> <span class="value">{{ instance_size }}</span></div>
              <div class="detail"><span class="label">Region:</span> <span class="value">{{ region }}</span></div>
              <div class="detail"><span class="label">Database:</span> <span class="value">{{ database_engine }}</span></div>
              <div class="detail"><span class="label">Monitoring:</span> <span class="value">{{ enable_monitoring }}</span></div>
              <div class="detail"><span class="label">TTL:</span> <span class="value">{{ ttl_hours }} hours</span></div>
              <div class="detail"><span class="label">Provisioned by:</span> <span class="value">Ansible Automation Portal</span></div>
            </div>
          </body>
          </html>
          LANDING
          systemctl enable httpd
          systemctl start httpd
        tags:
          Environment: "{{ environment_name }}"
          ManagedBy: ansible-portal
          TTL: "{{ ttl_hours }}"
          Role: app
          owner: forrest
        state: running
      register: ec2_result

    - name: EC2 instance launched
      ansible.builtin.debug:
        msg: "Instance {{ ec2_result.instances[0].instance_id }} running at {{ ec2_result.instances[0].public_ip_address | default('pending') }}"

    - name: Launch VS Code environment ({{ instance_size }})
      amazon.aws.ec2_instance:
        name: "{{ environment_name }}-vscode"
        instance_type: "{{ instance_types[instance_size] }}"
        image_id: "{{ ami_ids[aws_region] }}"
        region: "{{ aws_region }}"
        key_name: dev-team
        security_groups:
          - "{{ sg_result.group_id }}"
        wait: true
        user_data: |
          #!/bin/bash
          set -eux
          curl -fsSL https://code-server.dev/install.sh | sh
          mkdir -p /home/ec2-user/.config/code-server /home/ec2-user/project
          cat > /home/ec2-user/.config/code-server/config.yaml <<'CSCONF'
          bind-addr: 0.0.0.0:8080
          auth: password
          password: Forrest2026Demo
          cert: false
          CSCONF
          cat > /home/ec2-user/project/README.md <<'README'
          # {{ environment_name }}
          Provisioned by Ansible Automation Portal.
          App: see the companion instance.
          Database: {{ database_engine }}
          Region: {{ region }}
          README
          chown -R ec2-user:ec2-user /home/ec2-user/.config /home/ec2-user/project
          cat > /etc/systemd/system/code-server.service <<'UNIT'
          [Unit]
          Description=code-server
          After=network.target
          [Service]
          Type=simple
          User=ec2-user
          ExecStart=/usr/bin/code-server --config /home/ec2-user/.config/code-server/config.yaml /home/ec2-user/project
          Restart=always
          [Install]
          WantedBy=multi-user.target
          UNIT
          systemctl daemon-reload
          systemctl enable --now code-server
        tags:
          Environment: "{{ environment_name }}"
          ManagedBy: ansible-portal
          TTL: "{{ ttl_hours }}"
          Role: vscode
          owner: forrest
        state: running
      register: vscode_result

    - name: VS Code instance launched
      ansible.builtin.debug:
        msg: "VS Code {{ vscode_result.instances[0].instance_id }} at {{ vscode_result.instances[0].public_ip_address | default('pending') }}:8080 (installing in background)"

    - name: Look up default VPC subnets
      amazon.aws.ec2_vpc_subnet_info:
        region: "{{ aws_region }}"
        filters:
          default-for-az: "true"
      register: default_subnets
      when: database_engine != "none"

    - name: Create RDS database subnet group
      amazon.aws.rds_subnet_group:
        name: "{{ safe_name }}-dbsubnet"
        description: "DB subnet group for {{ environment_name }}"
        region: "{{ aws_region }}"
        subnets: "{{ default_subnets.subnets | map(attribute='id') | list }}"
        state: present
      when: database_engine != "none"

    - name: Create database security group
      amazon.aws.ec2_security_group:
        name: "{{ safe_name }}-db-sg"
        description: "Database security group for {{ environment_name }}"
        region: "{{ aws_region }}"
        rules:
          - proto: tcp
            from_port: "{{ db_ports[database_engine] }}"
            to_port: "{{ db_ports[database_engine] }}"
            group_id: "{{ sg_result.group_id }}"
        tags:
          Name: "{{ safe_name }}-db-sg"
          Environment: "{{ environment_name }}"
          ManagedBy: ansible-portal
          owner: forrest
      register: db_sg_result
      when: database_engine != "none"

    - name: Provision {{ database_engine }} database
      amazon.aws.rds_instance:
        db_instance_identifier: "{{ safe_name }}-db"
        db_instance_class: db.t3.micro
        engine: "{{ db_engine_map[database_engine] }}"
        master_username: dbadmin
        master_user_password: "{{ db_password }}"
        allocated_storage: 20
        region: "{{ aws_region }}"
        db_subnet_group_name: "{{ safe_name }}-dbsubnet"
        vpc_security_group_ids:
          - "{{ db_sg_result.group_id }}"
        tags:
          Environment: "{{ environment_name }}"
          ManagedBy: ansible-portal
          owner: forrest
        state: present
        wait: true
      register: rds_result
      when: database_engine != "none"

    - name: Database provisioned
      ansible.builtin.debug:
        msg: "{{ database_engine }} endpoint: {{ rds_result.endpoint.address }}:{{ rds_result.endpoint.port }}"
      when: database_engine != "none"

    - name: Initialize database
      ansible.builtin.shell: |
        {% if database_engine == "postgresql" %}
        PGPASSWORD="{{ db_password }}" psql -h {{ rds_result.endpoint.address }} -U dbadmin -tc "CREATE DATABASE forrest;" 2>/dev/null || true
        {% elif database_engine == "mysql" %}
        mysql -h {{ rds_result.endpoint.address }} -u dbadmin -p"{{ db_password }}" -e "CREATE DATABASE forrest;" 2>/dev/null || true
        {% endif %}
      when: database_engine != "none"
      ignore_errors: true

    - name: Enable EC2 CPU monitoring
      amazon.aws.cloudwatch_metric_alarm:
        name: "{{ safe_name }}-ec2-cpu-alarm"
        metric_name: CPUUtilization
        namespace: AWS/EC2
        statistic: Average
        comparison: GreaterThanThreshold
        threshold: 80.0
        period: 300
        evaluation_periods: 2
        dimensions:
          InstanceId: "{{ ec2_result.instances[0].instance_id }}"
        region: "{{ aws_region }}"
        state: present
      when: enable_monitoring == "yes"

    - name: Enable RDS CPU monitoring
      amazon.aws.cloudwatch_metric_alarm:
        name: "{{ safe_name }}-rds-cpu-alarm"
        metric_name: CPUUtilization
        namespace: AWS/RDS
        statistic: Average
        comparison: GreaterThanThreshold
        threshold: 70.0
        period: 300
        evaluation_periods: 2
        dimensions:
          DBInstanceIdentifier: "{{ rds_result.db_instance_identifier }}"
        region: "{{ aws_region }}"
        state: present
      when: enable_monitoring == "yes" and database_engine != "none"

    - name: Enable RDS storage monitoring
      amazon.aws.cloudwatch_metric_alarm:
        name: "{{ safe_name }}-rds-storage-alarm"
        metric_name: FreeStorageSpace
        namespace: AWS/RDS
        statistic: Average
        comparison: LessThanThreshold
        threshold: 4294967296
        period: 300
        evaluation_periods: 2
        dimensions:
          DBInstanceIdentifier: "{{ rds_result.db_instance_identifier }}"
        region: "{{ aws_region }}"
        state: present
      when: enable_monitoring == "yes" and database_engine != "none"

    - name: Enable RDS connections monitoring
      amazon.aws.cloudwatch_metric_alarm:
        name: "{{ safe_name }}-rds-connections-alarm"
        metric_name: DatabaseConnections
        namespace: AWS/RDS
        statistic: Average
        comparison: GreaterThanThreshold
        threshold: 80.0
        period: 300
        evaluation_periods: 2
        dimensions:
          DBInstanceIdentifier: "{{ rds_result.db_instance_identifier }}"
        region: "{{ aws_region }}"
        state: present
      when: enable_monitoring == "yes" and database_engine != "none"

    - name: Monitoring enabled
      ansible.builtin.debug:
        msg:
          - "CloudWatch alarms configured for {{ environment_name }}"
          - "EC2 CPU alarm: {{ safe_name }}-ec2-cpu-alarm"
          - "{{ 'RDS CPU alarm: ' + safe_name + '-rds-cpu-alarm' if database_engine != 'none' else '' }}"
          - "{{ 'RDS Storage alarm: ' + safe_name + '-rds-storage-alarm' if database_engine != 'none' else '' }}"
          - "{{ 'RDS Connections alarm: ' + safe_name + '-rds-connections-alarm' if database_engine != 'none' else '' }}"
      when: enable_monitoring == "yes"

    - name: Auto-shutdown scheduled
      ansible.builtin.debug:
        msg: "{{ environment_name }} will auto-terminate in {{ ttl_hours }} hours"

    - name: Wait for VS Code environment
      ansible.builtin.uri:
        url: "http://{{ vscode_result.instances[0].public_ip_address }}:8080"
        status_code:
          - 200
          - 302
          - 401
      register: vscode_ready
      until: vscode_ready.status in [200, 302, 401]
      retries: 36
      delay: 10
      ignore_errors: true

    - name: Provisioning complete
      ansible.builtin.debug:
        msg: |

          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
          
          Environment {{ environment_name }} is ready in {{ region }}
          
          Instance: {{ ec2_result.instances[0].instance_id }} ({{ ec2_result.instances[0].public_ip_address | default('pending') }})
          
          Web: http://{{ ec2_result.instances[0].public_ip_address | default('pending') }}
          
          VS Code: http://{{ vscode_result.instances[0].public_ip_address | default('pending') }}:8080
          VS Code password: Forrest2026Demo
          
          SSH: ssh -i dev-team.pem ec2-user@{{ ec2_result.instances[0].public_ip_address | default('pending') }}
          
          {{ 'Database: ' + rds_result.endpoint.address + ':' + rds_result.endpoint.port|string if database_engine != 'none' else 'Database: none' }}
          
          {{ 'DB Connect: psql -h ' + rds_result.endpoint.address + ' -U dbadmin -d postgres -W' if database_engine == 'postgresql' else 'DB Connect: ssh -i dev-team.pem ec2-user@' + ec2_result.instances[0].public_ip_address | default('pending') + ' then mysql -h ' + rds_result.endpoint.address + ' -u dbadmin -p' if database_engine == 'mysql' else '' }}
          
          {{ 'DB Password: Forrest2026Demo' if database_engine != 'none' else '' }}
          
          {{ 'Monitoring: https://console.aws.amazon.com/cloudwatch/home?region=' + region + '#alarmsV2:alarm/' + safe_name + '-ec2-cpu-alarm' if enable_monitoring == 'yes' else 'Monitoring: disabled' }}
          
          TTL: {{ ttl_hours }} hours
          
          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
